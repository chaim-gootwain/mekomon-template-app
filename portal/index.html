<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@@PAPER_NAME@@ — הגשת מודעה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* פורטל הלקוחות — עיצוב לפי צבעי העיתון, פשוט ונקי במיוחד */
:root { --brand:@@COLOR_BRAND@@; --brand-dark:@@COLOR_DARK@@; --accent:@@COLOR_GRAD@@; --bg:@@COLOR_BG@@; --line:#dfe2f0; --muted:#64748b; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Heebo','Segoe UI',Arial,sans-serif; background:var(--bg); color:#1c2438; min-height:100vh; }
.top { background:var(--brand-dark); color:#fff; padding:22px 16px; text-align:center; }
.top .logo { font-size:1.6rem; font-weight:800; }
.top .logo span { color:#ff6b6e; }
.top .sub { font-size:.85rem; opacity:.75; margin-top:2px; }
.wrap { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
.card { background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(29,39,101,.08); padding:22px; margin-top:16px; }
h2 { color:var(--brand-dark); font-size:1.1rem; margin-bottom:12px; }
label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
.field { margin-bottom:14px; }
input, select, textarea { width:100%; font-family:inherit; font-size:1rem; padding:11px 12px;
border:1px solid var(--line); border-radius:9px; background:#fff; }
input:focus, select:focus, textarea:focus { outline:2px solid var(--brand); outline-offset:-1px; }
.btn { width:100%; background:var(--brand); color:#fff; border:none; border-radius:9px;
padding:13px; font-size:1.05rem; font-weight:700; font-family:inherit; cursor:pointer; }
.btn:hover { background:var(--brand-dark); }
.btn:disabled { opacity:.6; }
.file-drop { border:2px dashed var(--line); border-radius:10px; padding:18px; text-align:center;
color:var(--muted); font-size:.9rem; cursor:pointer; }
.file-drop.has-file { border-color:var(--brand); color:var(--brand); background:#f6f7fd; }
.msg { text-align:center; padding:14px; border-radius:10px; margin-top:14px; font-size:.95rem; display:none; }
.msg.ok { background:#e6f4ea; color:#1e7e34; display:block; }
.msg.err { background:#fdecea; color:#c0392b; display:block; }
.status-list { list-style:none; }
.status-list li { display:flex; justify-content:space-between; gap:10px; padding:10px 0;
border-bottom:1px solid var(--line); font-size:.9rem; flex-wrap:wrap; }
.status-list li:last-child { border-bottom:none; }
.pill { background:@@COLOR_LIGHT@@; color:var(--brand); border-radius:99px; padding:3px 12px; font-size:.78rem; font-weight:700; }
.center-msg { text-align:center; padding:60px 20px; color:var(--muted); }
</style>
</head>
<body>

<div class="top">
<div class="logo">@@PAPER_NAME@@</div>
<div class="sub">הגשת מודעות לפרסום</div>
</div>

<div class="wrap">
<div id="loading" class="center-msg">טוען...</div>

<div id="invalid" class="center-msg" style="display:none">
<h2 style="margin-bottom:8px">הקישור אינו תקף</h2>
לקבלת קישור חדש פנה אלינו: @@PAPER_PHONE@@
</div>

<div id="portal" style="display:none">
<div class="card">
<h2>שלום, <span id="custName"></span> 👋</h2>
<p style="font-size:.9rem;color:var(--muted)">כאן מגישים מודעה לפרסום בעיתון. ממלאים, שולחים — ואנחנו כבר ממשיכים משם.</p>
</div>

<div class="card">
<h2>הגשת מודעה חדשה</h2>
<div class="field">
<label>גודל המודעה המבוקש</label>
<select id="adSize"></select>
</div>
<div class="field">
<label>קובץ המודעה (אם יש — תמונה או PDF)</label>
<input type="file" id="adFile" accept="image/*,.pdf" style="display:none" onchange="fileChosen()">
<div class="file-drop" id="fileDrop" onclick="document.getElementById('adFile').click()">
📎 לחץ לבחירת קובץ
</div>
</div>
<div class="field">
<label>או כתוב כאן את תוכן המודעה בטקסט חופשי</label>
<textarea id="adText" rows="4" placeholder="נוסח המודעה, פרטים ליצירת קשר..."></textarea>
</div>
<div class="field">
<label>הערות (מיקום מועדף, בקשות מיוחדות...)</label>
<input id="adNotes">
</div>
<button class="btn" id="sendBtn" onclick="submitAd()">שליחת המודעה ✈</button>
<div class="msg" id="msg"></div>
</div>

<div class="card">
<h2>המודעות שלך</h2>
<ul class="status-list" id="adsList"></ul>
</div>
</div>
</div>

<script>
'use strict';

/* ============================================================
פורטל הלקוחות — עובד עם קישור אישי בלבד (?t=טוקן)
אין כאן סיסמה: הטוקן מזהה את הלקוח, והשרת מוודא אותו
בכל פעולה. הלקוח רואה אך ורק את המודעות של עצמו.
============================================================
הגדרות חיבור — אותם ערכים כמו במערכת הראשית: */
const SUPABASE_URL = '@@SUPABASE_URL@@';
const SUPABASE_KEY = '@@SUPABASE_KEY@@';

const token = new URLSearchParams(location.search).get('t');
let db = null;

async function init() {
if (!token || SUPABASE_URL.startsWith('PASTE')) { showInvalid(); return; }
db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const { data, error } = await db.rpc('portal_info', { p_token: token });
if (error || !data) { showInvalid(); return; }

document.getElementById('custName').textContent = data.customer_name;
document.getElementById('adSize').innerHTML =
data.sizes.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
document.getElementById('adsList').innerHTML = data.ads.length
? data.ads.map(a => `<li><span>${escapeHtml(a.title)}<br>
<small style="color:var(--muted)">${a.created_at}${a.issue ? ' · ' + a.issue : ''}</small></span>
<span class="pill">${a.status}</span></li>`).join('')
: '<li style="color:var(--muted)">עדיין אין מודעות</li>';

document.getElementById('loading').style.display = 'none';
document.getElementById('portal').style.display = 'block';
}

function showInvalid() {
document.getElementById('loading').style.display = 'none';
document.getElementById('invalid').style.display = 'block';
}

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fileChosen() {
const f = document.getElementById('adFile').files[0];
const drop = document.getElementById('fileDrop');
drop.textContent = f ? '✓ ' + f.name : '📎 לחץ לבחירת קובץ';
drop.classList.toggle('has-file', !!f);
}

async function submitAd() {
const btn = document.getElementById('sendBtn');
const msg = document.getElementById('msg');
const file = document.getElementById('adFile').files[0];
const text = document.getElementById('adText').value.trim();
msg.className = 'msg';

if (!file && !text) {
msg.textContent = 'נא לצרף קובץ או לכתוב את תוכן המודעה';
msg.classList.add('err');
return;
}

btn.disabled = true; btn.textContent = 'שולח...';
try {
/* העלאת קובץ לתיקייה של הטוקן — המדיניות בשרת מוודאת שהטוקן תקף */
let filePath = '', fileName = '';
if (file) {
if (file.size > 20 * 1024 * 1024) throw new Error('הקובץ גדול מדי (מקסימום 20MB)');
fileName = file.name;
filePath = `portal/${token}/${Date.now()}_${file.name}`;
const { error: upErr } = await db.storage.from('ad-files').upload(filePath, file);
if (upErr) throw upErr;
}
const { error } = await db.rpc('portal_submit_ad', {
p_token: token,
p_size_id: Number(document.getElementById('adSize').value),
p_text: text,
p_notes: document.getElementById('adNotes').value.trim(),
p_file_path: filePath,
p_file_name: fileName,
});
if (error) throw error;

msg.textContent = '✓ המודעה נשלחה בהצלחה! נחזור אליך בהקדם.';
msg.classList.add('ok');
document.getElementById('adText').value = '';
document.getElementById('adNotes').value = '';
document.getElementById('adFile').value = '';
fileChosen();
init(); // רענון רשימת המודעות
} catch (e) {
msg.textContent = 'שגיאה בשליחה: ' + (e.message || e);
msg.classList.add('err');
}
btn.disabled = false; btn.textContent = 'שליחת המודעה ✈';
}

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הגדרת סיסמה — @@PAPER_NAME@@</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:Heebo,sans-serif;background:#f4f6fb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.12);padding:28px;max-width:380px;width:92%}
  .card h1{color:@@COLOR_DARK@@;font-size:1.3rem;margin:0 0 4px}
  .sub{color:#8890a6;font-size:.9rem;margin-bottom:18px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:.85rem;margin-bottom:4px;color:#555}
  .field input{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;box-sizing:border-box;direction:ltr;font-size:1rem}
  .btn{width:100%;padding:12px;border:0;border-radius:10px;background:@@COLOR_BRAND@@;color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .err{color:#c0392b;font-size:.85rem;margin-top:10px;min-height:18px}
  .ok{color:#1a7f37}
</style>
</head>
<body>
<div class="card">
  <h1>ברוכים הבאים 👋</h1>
  <div class="sub" id="sub">הגדירו סיסמה כדי להיכנס למערכת</div>
  <div id="form">
    <div class="field"><label>סיסמה חדשה (8 תווים לפחות)</label><input id="pw1" type="password" autocomplete="new-password"></div>
    <div class="field"><label>אימות סיסמה</label><input id="pw2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')setPw()"></div>
    <button class="btn" id="btn" onclick="setPw()">שמירה וכניסה</button>
    <div class="err" id="err"></div>
  </div>
</div>
<script>
const SB_URL = '@@SUPABASE_URL@@';
const SB_KEY = '@@SUPABASE_KEY@@';
const client = supabase.createClient(SB_URL, SB_KEY);

async function ensureSession() {
  // supabase-js קולט אוטומטית את הטוקן מכתובת ההזמנה (#access_token...)
  await new Promise(r => setTimeout(r, 400));
  const { data } = await client.auth.getSession();
  if (!data.session) {
    document.getElementById('sub').textContent = 'הקישור אינו תקף או פג תוקף. בקשו מהמנהל הזמנה חדשה.';
    document.getElementById('form').style.display = 'none';
  }
}
ensureSession();

async function setPw() {
  const p1 = document.getElementById('pw1').value;
  const p2 = document.getElementById('pw2').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  err.className = 'err'; err.textContent = '';
  if (p1.length < 8) { err.textContent = 'סיסמה של 8 תווים לפחות'; return; }
  if (p1 !== p2) { err.textContent = 'הסיסמאות אינן תואמות'; return; }
  btn.disabled = true;
  const { error } = await client.auth.updateUser({ password: p1 });
  if (error) { err.textContent = error.message; btn.disabled = false; return; }
  err.className = 'err ok'; err.textContent = 'הסיסמה נשמרה! מעביר למערכת...';
  setTimeout(() => { location.href = '/'; }, 1200);
}
</script>
</body>
</html>

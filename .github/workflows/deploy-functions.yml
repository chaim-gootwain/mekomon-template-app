# .github/workflows/deploy-functions.yml
# ------------------------------------------------------------------------------
# פריסה אוטומטית של כל ה-Edge Functions למופע (Supabase) — ישירות מהתבנית,
# שהיא מקור האמת. סוגר את הפער שבו פונקציות לא הסתנכרנו ונשארו ידניות.
#
# איך זה עובד: כשמתעדכנת התבנית, notify-instances שולח repository_dispatch
# מסוג template-updated לכל מופע. ה-workflow הזה (שיושב בכל ריפו-מופע) מושך את
# הפונקציות *מהתבנית*, מחליף בהן את הטוקנים בערכים של המופע (מ-vars), ופורס
# ל-Supabase של אותו מופע. כך אין צורך לסנכרן את הפונקציות לתוך ריפו-המופע,
# ואין נגיעה בסנכרון צד-הלקוח.
#
# מה שצריך פעם אחת בכל ריפו-מופע (Settings → Secrets and variables → Actions):
#   Secret   SUPABASE_ACCESS_TOKEN = טוקן מ- https://supabase.com/dashboard/account/tokens
#   Variable SUPABASE_PROJECT_REF  = מזהה הפרויקט (עמנואל = hkbstegusfdjtkjxkmjc)
#   Variables PAPER_NAME, PAPER_EMAIL = שם העיתון והמייל (כבר קיימים לסנכרון צד-הלקוח)
#
# verify_jwt נקבע מ-supabase/config.toml שבתבנית (send-email=false, השאר true).
# call-dial לא בתבנית ולכן לא נפרסת/נגעת כאן — נשארת פר-לקוח.
# ------------------------------------------------------------------------------
name: Deploy Edge Functions to Supabase

on:
  repository_dispatch:
    types: [template-updated]      # נשלח ע"י notify-instances שבתבנית אחרי עדכון
  workflow_dispatch:                # הרצה ידנית מדף ה-Actions

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEMPLATE_REPO: https://github.com/chaim-gootwain/mekomon-template-app

jobs:
  deploy:
    # רץ רק בריפו-מופע שבו הוגדר SUPABASE_PROJECT_REF. בתבנית (אין var) מדולג.
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch functions from template (source of truth)
        run: |
          git clone --depth 1 "$TEMPLATE_REPO" tpl
          echo "── functions in template ──"
          ls tpl/supabase/functions

      - name: Substitute per-instance values into function source
        env:
          PAPER_NAME: ${{ vars.PAPER_NAME }}
          PAPER_EMAIL: ${{ vars.PAPER_EMAIL }}
        run: |
          cd tpl
          # החלפת הטוקנים בערכי המופע (מ-vars של הריפו). מפריד sed = | כדי לא
          # להתנגש עם תווים בערכים:
          grep -rl '@@PAPER_' supabase/functions | while read -r f; do
            sed -i "s|@@PAPER_NAME@@|${PAPER_NAME}|g; s|@@PAPER_EMAIL@@|${PAPER_EMAIL}|g" "$f"
          done
          # שסתום ביטחון: לעולם לא לפרוס קוד עם טוקן לא-מוחלף.
          if grep -rq '@@PAPER_' supabase/functions; then
            echo "::error::נשארו טוקנים לא-מוחלפים — ודא ש-PAPER_NAME ו-PAPER_EMAIL מוגדרים כ-Variables בריפו."
            grep -rl '@@PAPER_' supabase/functions
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          cd tpl
          # פורס את כל הפונקציות שבתבנית ל-Supabase של המופע. verify_jwt מ-config.toml.
          supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Done
        run: echo "✅ נפרסו כל ה-Edge Functions מהתבנית ל-${{ vars.SUPABASE_PROJECT_REF }}"

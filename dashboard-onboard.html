<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>לוח בקרה אונבורדינג - מקומון</title>
	<style>
		* { box-sizing: border-box; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: #f5f5f5;
			padding: 2rem;
			margin: 0;
		}
		.container {
			max-width: 1000px;
			margin: 0 auto;
		}
		h1 {
			text-align: center;
			margin-bottom: 2rem;
			color: #333;
		}
		.button-group {
			margin-bottom: 2rem;
			text-align: center;
		}
		.btn {
			display: inline-block;
			padding: 0.75rem 1.5rem;
			background: #0066cc;
			color: white;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			text-decoration: none;
			margin: 0 0.5rem;
			transition: background 0.2s;
		}
		.btn:hover {
			background: #0052a3;
		}
		.btn-secondary {
			background: #666;
		}
		.btn-secondary:hover {
			background: #555;
		}
		table {
			width: 100%;
			border-collapse: collapse;
			background: white;
			border-radius: 8px;
			overflow: hidden;
			box-shadow: 0 2px 8px rgba(0,0,0,0.1);
		}
		thead {
			background: #f9f9f9;
			border-bottom: 2px solid #ddd;
		}
		th, td {
			padding: 1rem;
			text-align: right;
			border-bottom: 1px solid #ddd;
		}
		tr:last-child td {
			border-bottom: none;
		}
		.status {
			display: inline-block;
			padding: 0.4rem 0.8rem;
			border-radius: 20px;
			font-size: 0.85rem;
			font-weight: 600;
		}
		.status.pending {
			background: #ffeaa7;
			color: #856404;
		}
		.status.in-progress {
			background: #74b9ff;
			color: #2d3436;
		}
		.status.completed {
			background: #81c784;
			color: #fff;
		}
		.status.error {
			background: #e74c3c;
			color: #fff;
		}
		.action {
			display: flex;
			gap: 0.5rem;
		}
		.action button {
			padding: 0.5rem 1rem;
			font-size: 0.85rem;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			transition: background 0.2s;
		}
		.action .run {
			background: #27ae60;
			color: white;
		}
		.action .run:hover {
			background: #229954;
		}
		.action .details {
			background: #3498db;
			color: white;
		}
		.action .details:hover {
			background: #2980b9;
		}
		.modal {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0,0,0,0.5);
			z-index: 1000;
			justify-content: center;
			align-items: center;
		}
		.modal.show {
			display: flex;
		}
		.modal-content {
			background: white;
			border-radius: 8px;
			padding: 2rem;
			max-width: 600px;
			width: 90%;
			box-shadow: 0 4px 16px rgba(0,0,0,0.2);
		}
		.modal-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 1rem;
			border-bottom: 1px solid #ddd;
			padding-bottom: 1rem;
		}
		.modal-header h2 {
			margin: 0;
		}
		.modal-close {
			background: none;
			border: none;
			font-size: 1.5rem;
			cursor: pointer;
			color: #666;
		}
		.modal-body {
			margin-bottom: 1rem;
			max-height: 400px;
			overflow-y: auto;
		}
		.modal-body pre {
			background: #f5f5f5;
			padding: 1rem;
			border-radius: 4px;
			overflow-x: auto;
			font-size: 0.85rem;
		}
		.modal-footer {
			display: flex;
			gap: 0.5rem;
			justify-content: flex-end;
		}
		.modal-footer button {
			padding: 0.75rem 1.5rem;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			transition: background 0.2s;
		}
		.modal-footer .btn-primary {
			background: #0066cc;
			color: white;
		}
		.modal-footer .btn-primary:hover {
			background: #0052a3;
		}
		.modal-footer .btn-cancel {
			background: #ddd;
			color: #333;
		}
		.modal-footer .btn-cancel:hover {
			background: #ccc;
		}
		.spinner {
			display: inline-block;
			width: 1rem;
			height: 1rem;
			border: 2px solid rgba(0,0,0,0.1);
			border-top-color: #0066cc;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
			margin-left: 0.5rem;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		.empty-state {
			text-align: center;
			padding: 3rem 1rem;
			color: #666;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>לוח בקרה אונבורדינג</h1>

		<div class="button-group">
			<a href="onboard-form.html" class="btn">➕ לקוח חדש</a>
			<button class="btn btn-secondary" onclick="refreshData()">🔄 רענן</button>
		</div>

		<table id="customersTable">
			<thead>
				<tr>
					<th>שם לקוח</th>
					<th>דוא"ל</th>
					<th>סטטוס</th>
					<th>תאריך הוספה</th>
					<th>פעולות</th>
				</tr>
			</thead>
			<tbody id="customersBody">
				<tr>
					<td colspan="5" class="empty-state">
						<p>אין לקוחות עדיין. <a href="onboard-form.html">צור לקוח חדש</a></p>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<!-- Run modal -->
	<div class="modal" id="runModal">
		<div class="modal-content">
			<div class="modal-header">
				<h2>הרצה אוטומטית</h2>
				<button class="modal-close" onclick="closeModal('runModal')">✕</button>
			</div>
			<div class="modal-body">
				<p>לאחר ההרצה, ה-script יעדכן את סטטוס הלקוח בזמן אמת.</p>
				<p><strong>לקוח:</strong> <span id="runCustomerName"></span></p>
				<div id="runLog" style="max-height: 300px; overflow-y: auto; background: #f5f5f5; padding: 1rem; border-radius: 4px; font-family: monospace; font-size: 0.85rem;">
					הוראות הרצה יופיעו כאן...
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn-cancel" onclick="closeModal('runModal')">סגור</button>
				<button class="btn-primary" onclick="startOnboarding()">התחל <span class="spinner" id="runSpinner" style="display: none;"></span></button>
			</div>
		</div>
	</div>

	<!-- Details modal -->
	<div class="modal" id="detailsModal">
		<div class="modal-content">
			<div class="modal-header">
				<h2>פרטים</h2>
				<button class="modal-close" onclick="closeModal('detailsModal')">✕</button>
			</div>
			<div class="modal-body">
				<pre id="detailsContent"></pre>
			</div>
			<div class="modal-footer">
				<button class="btn-cancel" onclick="closeModal('detailsModal')">סגור</button>
			</div>
		</div>
	</div>

	<script>
		let customers = [];
		let currentCustomer = null;

		async function loadCustomers() {
			try {
				const response = await fetch('/api/customers');
				if (response.ok) {
					customers = await response.json();
					renderTable();
				}
			} catch (err) {
				console.error('Error loading customers:', err);
			}
		}

		function renderTable() {
			const tbody = document.getElementById('customersBody');
			if (customers.length === 0) {
				tbody.innerHTML = `
					<tr>
						<td colspan="5" class="empty-state">
							<p>אין לקוחות עדיין. <a href="onboard-form.html">צור לקוח חדש</a></p>
						</td>
					</tr>
				`;
				return;
			}

			tbody.innerHTML = customers.map(customer => {
				const statusClass = /^[a-z-]+$/.test(customer.status) ? customer.status : '';
				return `
				<tr>
					<td>${escapeHtml(customer.paperName)}</td>
					<td>${escapeHtml(customer.paperEmail)}</td>
					<td><span class="status ${statusClass}">${getStatusLabel(customer.status)}</span></td>
					<td>${formatDate(customer.createdAt)}</td>
					<td class="action">
						${customer.status !== 'completed' ? `<button class="run" onclick="showRunModal('${escapeHtml(customer.id)}')">הרץ</button>` : ''}
						<button class="details" onclick="showDetailsModal('${escapeHtml(customer.id)}')">פרטים</button>
					</td>
				</tr>
			`;
			}).join('');
		}

		function getStatusLabel(status) {
			const labels = {
				'pending': 'ממתין',
				'in-progress': 'בביצוע',
				'completed': 'הושלם',
				'error': 'שגיאה'
			};
			return labels[status] || status;
		}

		function formatDate(dateStr) {
			if (!dateStr) return '-';
			const date = new Date(dateStr);
			return date.toLocaleDateString('he-IL');
		}

		function escapeHtml(text) {
			const div = document.createElement('div');
			div.textContent = text;
			return div.innerHTML;
		}

		function showRunModal(customerId) {
			currentCustomer = customers.find(c => c.id === customerId);
			if (!currentCustomer) return;

			document.getElementById('runCustomerName').textContent = escapeHtml(currentCustomer.paperName);
			document.getElementById('runLog').innerHTML = `
				<div>⏳ הכנת ריצה...</div>
				<div>• בדיקת קונפיגורציה</div>
				<div>• בדיקת הרשאות API</div>
				<div>• בדיקת סודות</div>
				<div>...</div>
			`;
			document.getElementById('runSpinner').style.display = 'none';
			openModal('runModal');
		}

		function showDetailsModal(customerId) {
			currentCustomer = customers.find(c => c.id === customerId);
			if (!currentCustomer) return;

			const details = {
				...currentCustomer,
				gmailAppPassword: currentCustomer.gmailAppPassword ? '***' : '-',
				ezcountApiKey: currentCustomer.ezcountApiKey ? '***' : '-',
				greeninvoiceKey: currentCustomer.greeninvoiceKey ? '***' : '-',
				greeninvoiceSecret: currentCustomer.greeninvoiceSecret ? '***' : '-',
				anthropicApiKey: currentCustomer.anthropicApiKey ? '***' : '-',
			};

			document.getElementById('detailsContent').textContent = JSON.stringify(details, null, 2);
			openModal('detailsModal');
		}

		async function startOnboarding() {
			if (!currentCustomer) return;

			const spinner = document.getElementById('runSpinner');
			spinner.style.display = 'inline-block';

			const logDiv = document.getElementById('runLog');
			logDiv.innerHTML = '';

			try {
				const response = await fetch('/api/onboard-run', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ customerId: currentCustomer.id })
				});

				if (!response.ok) {
					throw new Error('שגיאה בהרצה');
				}

				// Stream logs (textContent מונע XSS מתגובה שרת שמכילה ערכים מ-DB)
				const reader = response.body.getReader();
				const decoder = new TextDecoder();

				while (true) {
					const { done, value } = await reader.read();
					if (done) break;
					const text = decoder.decode(value);
					const line = document.createElement('div');
					line.textContent = text;
					logDiv.appendChild(line);
					logDiv.scrollTop = logDiv.scrollHeight;
				}

				await loadCustomers();
			} catch (err) {
				const errDiv = document.createElement('div');
				errDiv.style.color = 'red';
				errDiv.textContent = '❌ ' + err.message;
				logDiv.appendChild(errDiv);
			} finally {
				spinner.style.display = 'none';
			}
		}

		function openModal(modalId) {
			document.getElementById(modalId).classList.add('show');
		}

		function closeModal(modalId) {
			document.getElementById(modalId).classList.remove('show');
		}

		function refreshData() {
			loadCustomers();
		}

		// Load on page load
		loadCustomers();
		setInterval(loadCustomers, 30000); // Auto-refresh every 30 seconds
	</script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>שמירת כרטיס — @@PAPER_NAME@@</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:Heebo,sans-serif;background:#f4f6fb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box}
  .card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.12);padding:28px;max-width:420px;width:100%;text-align:center}
  h1{color:@@COLOR_BRAND@@;font-size:1.35rem;margin:8px 0}
  p{color:#555;line-height:1.6}
  .ico{font-size:2.6rem}
</style>
</head>
<body>
<div class="card" id="box">
  <div class="ico">✅</div>
  <h1>הכרטיס נשמר בהצלחה</h1>
  <p>תודה! פרטי הכרטיס נשמרו בצורה מאובטחת אצל חברת הסליקה, לצורך החיוב החודשי שסיכמנו.<br>בשמירה עצמה לא בוצע חיוב.</p>
  <p style="font-size:.9rem;color:#8890a6">@@PAPER_NAME@@</p>
</div>
<script>
  if (new URLSearchParams(location.search).get('ok') === '0') {
    document.getElementById('box').innerHTML = '<div class="ico">⚠️</div><h1>הכרטיס לא נשמר</h1><p>הפעולה בוטלה או לא הושלמה. אפשר לפתוח שוב את הקישור שקיבלתם ולנסות שוב, או לפנות אלינו.</p><p style="font-size:.9rem;color:#8890a6">@@PAPER_NAME@@ · @@PAPER_PHONE@@</p>';
  }
</script>
</body>
</html>
